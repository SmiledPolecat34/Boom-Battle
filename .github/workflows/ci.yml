name: CI

on:
  push:
    branches: [main]
  pull_request:

# Lecture seule : cette CI ne publie rien et n'écrit nulle part dans le dépôt.
permissions:
  contents: read

# Une nouvelle poussée annule l'exécution précédente de la même branche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LUNE_VERSION: "0.10.5"

jobs:
  tests:
    name: Tests Luau (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux-x86_64
          # Windows : le propriétaire développe sous Windows (fins de ligne CRLF, chemins) ; on le vérifie aussi.
          - os: windows-latest
            asset: windows-x86_64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Installer Lune ${{ env.LUNE_VERSION }}
        run: |
          set -euo pipefail
          url="https://github.com/lune-org/lune/releases/download/v${LUNE_VERSION}/lune-${LUNE_VERSION}-${{ matrix.asset }}.zip"
          mkdir -p "$RUNNER_TEMP/lune"
          curl --fail --location --silent --show-error --retry 3 "$url" -o "$RUNNER_TEMP/lune.zip"
          unzip -q -o "$RUNNER_TEMP/lune.zip" -d "$RUNNER_TEMP/lune"
          chmod +x "$RUNNER_TEMP/lune/lune"* 2>/dev/null || true
          echo "$RUNNER_TEMP/lune" >> "$GITHUB_PATH"

      - name: Version de Lune
        run: lune --version

      - name: Tests automatisés (syntaxe, logique, configs, intégrité)
        run: lune run tests/run -- --json test-report.json

      - name: Rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests-${{ matrix.os }}
          path: test-report.json
          if-no-files-found: ignore
          retention-days: 14

  # Une modification de src/ doit s'accompagner d'un test (étiquette « no-test-needed » pour une exception justifiée).
  change-gate:
    name: Garde-fou « une modif = un test »
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Vérifier que les changements de src/ ont un test
        env:
          ALLOW_NO_TEST: ${{ contains(github.event.pull_request.labels.*.name, 'no-test-needed') && '1' || '0' }}
        run: node tools/ci/check-tests-changed.js "origin/${{ github.base_ref }}"
